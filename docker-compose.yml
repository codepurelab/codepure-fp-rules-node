version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    privileged: true
    network_mode: host
    environment:
      - DB_PASSWORD=dev_db_password_123
      - REDIS_URL=redis://:dev_redis_pass@redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/host-etc:ro
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pass_123
      MYSQL_DATABASE: ecommerce_prod
    volumes:
      - /data/mysql:/var/lib/mysql

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    command: redis-server --requirepass dev_redis_pass
